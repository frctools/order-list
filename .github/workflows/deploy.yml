name: deploy

# Never triggered by pull_request: this job holds the production deploy key and
# the repo is a public fork, so a PR from anyone must not be able to reach it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: >-
          Allow a pending migration that may destroy data (a drop, rename or
          column type change) to run. Additive migrations apply on their own
          and do not need this. Read the SQL in drizzle/ before ticking it --
          nothing here can roll one back.
        type: boolean
        default: false

# One deploy at a time, and never cancel one part-way: a cancelled run can
# leave the droplet with files copied but nothing reloaded.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 67.207.85.228
  DEPLOY_USER: parts
  APP_DIR: /srv/parts

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate approvals, if the `production` environment has required reviewers.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ci.yml runs these too, but it does not gate this workflow, and shipping
      # a build that does not typecheck is worse than a slow deploy.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build app
        run: bun run build

      - name: Build vendord
        run: cd vendord && bunx nitro build

      # Written inline rather than through a third-party action, which would
      # otherwise get read access to the production key.
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Before the upload, not after: a deploy that cannot safely migrate must
      # stop while the server is still untouched and consistent. Shipping code
      # that queries a table its database does not have is invisible to every
      # other check here -- the build succeeds, static pages render, and only
      # the queries touching the new schema fail.
      - name: Check pending migrations
        id: migrations
        run: |
          applied=$(ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "docker exec parts-db-1 psql -U postgres -t -A -c \"select case when to_regclass('drizzle.__drizzle_migrations') is null then '' else (select string_agg(created_at::text, chr(10)) from drizzle.__drizzle_migrations) end\"")
          echo "$applied" | bun deploy/pending-migrations.mjs ${{ inputs.run_migrations && '--allow-destructive' || '' }}

      # --delete so a removed route cannot linger in .output, but .env and .data
      # (@nuxt/content's seeded SQLite) are runtime state, and rsync leaves
      # excluded paths on the receiver alone. .output/server/node_modules is
      # Nitro's traced dependency copy; the droplet resolves from its own
      # node_modules instead, which it needs anyway for drizzle-kit.
      - name: Upload
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.nuxt' \
            --exclude='.env' \
            --exclude='.data' \
            --exclude='.output/server/node_modules' \
            --exclude='vendord/node_modules' \
            --exclude='.wrangler' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"

      # A full install, not --production: .output does not vendor its
      # dependencies (better-sqlite3 is resolved from node_modules at runtime,
      # and /docs breaks without it) and drizzle-kit is a devDependency.
      - name: Install dependencies on the droplet
        run: ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "cd $APP_DIR && bun install"

      # Before the migrate that seeds vendors and the reload that reads .env.
      # Nothing else in this workflow runs `docker compose up`, so without
      # this step adding the service to docker-compose.yml would change
      # nothing on the droplet and search would answer 500 on every query.
      # Idempotent: compose only recreates containers whose config changed, so
      # a deploy that touches nothing leaves Postgres alone.
      - name: Start Meilisearch
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "cd $APP_DIR && bash -s" <<'REMOTE'
          set -euo pipefail
          # .env is the droplet's own -- rsync excludes it -- so the search
          # settings are added here rather than shipped. Appended only when
          # absent, and the generated key is written once and then left alone:
          # rotating it on every deploy would lock the running app out of its
          # own index until the next reload.
          if ! grep -q '^MEILISEARCH_HOST=' .env; then
            {
              echo ""
              echo "# Product search (docker compose service 'meilisearch', loopback-bound)."
              echo "MEILISEARCH_HOST=http://127.0.0.1:7700"
              echo "MEILISEARCH_INDEX=products"
            } >> .env
          fi
          if ! grep -q '^MEILISEARCH_API_KEY=' .env; then
            echo "MEILISEARCH_API_KEY=$(openssl rand -hex 24)" >> .env
          fi
          docker compose up -d
          for _ in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:7700/health >/dev/null 2>&1; then
              echo "meilisearch healthy"
              exit 0
            fi
            sleep 2
          done
          echo "meilisearch did not become healthy" >&2
          docker compose logs --tail 40 meilisearch >&2 || true
          exit 1
          REMOTE

      # Before the reload, never after: the new code queries columns the old
      # database may not have yet. Driven by what is actually pending rather
      # than by a checkbox -- a checkbox someone forgets to tick is how the
      # receipts feature shipped against a database with no receipts table.
      - name: Migrate
        if: steps.migrations.outputs.pending != '0'
        run: ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "cd $APP_DIR && bun run db:migrate"

      # Still before the reload: a migration that half-applied leaves the same
      # code/schema mismatch, so confirm rather than assume.
      - name: Verify schema is up to date
        if: steps.migrations.outputs.pending != '0'
        run: |
          applied=$(ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "docker exec parts-db-1 psql -U postgres -t -A -c \"select case when to_regclass('drizzle.__drizzle_migrations') is null then '' else (select string_agg(created_at::text, chr(10)) from drizzle.__drizzle_migrations) end\"")
          echo "$applied" | bun deploy/pending-migrations.mjs > /tmp/after.txt || true
          cat /tmp/after.txt
          grep -q 'No pending migrations' /tmp/after.txt

      - name: Reload
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $APP_DIR && pm2 reload ecosystem.config.cjs --update-env && pm2 save"

      - name: Smoke test
        run: |
          set -e
          # One URL per rendering path: prerendered landing, SSR'd app route,
          # Nuxt Content (needs better-sqlite3 and a seeded .data), and an API
          # route. Checking only / let a sitewide docs 404 ship green.
          probe() {
            curl -s -o /dev/null -m 10 -w '%{http_code}' "https://parts.innovatorsrobotics.com$1" || echo 000
          }
          for i in $(seq 1 10); do
            root=$(probe /)
            docs=$(probe /docs/getting-started)
            login=$(probe /auth/login)
            api=$(probe /api/orders)
            echo "attempt $i: /=$root docs=$docs login=$login api=$api"
            if [ "$root" = "200" ] && [ "$docs" = "200" ]                && [ "$login" = "200" ] && [ "$api" = "401" ]; then
              exit 0
            fi
            sleep 6
          done
          echo "site did not come back healthy"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "pm2 list; pm2 logs --nostream --lines 40" || true
          exit 1

      # Only when the index is empty, which in practice means the first deploy
      # after search shipped. A scrape walks twelve storefronts and takes
      # minutes, so doing it every push would slow every deploy and hammer
      # vendors for no reason; vendord's nightly task keeps it fresh after
      # this. Never fails the deploy -- the site is already up and verified,
      # and a stale index is not worth rolling back for.
      - name: Populate search index if empty
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "cd $APP_DIR && bash -s" <<'REMOTE'
          set -uo pipefail
          key=$(grep '^MEILISEARCH_API_KEY=' .env | cut -d= -f2-)
          stats=$(curl -fsS -m 10 -H "Authorization: Bearer $key" \
            http://127.0.0.1:7700/indexes/products/stats 2>/dev/null || echo '')
          count=$(printf '%s' "$stats" | sed -n 's/.*"numberOfDocuments":\([0-9]*\).*/\1/p')
          if [ -n "$count" ] && [ "$count" -gt 0 ] 2>/dev/null; then
            echo "index already holds $count documents; skipping scrape"
            exit 0
          fi
          echo "index empty -- running the initial scrape (this takes a few minutes)"
          curl -fsS -m 1800 http://127.0.0.1:3434/scrape || {
            echo "scrape failed; run 'curl localhost:3434/scrape' on the droplet" >&2
            exit 1
          }
          echo
          curl -fsS -m 10 -H "Authorization: Bearer $key" \
            http://127.0.0.1:7700/indexes/products/stats || true
          REMOTE
